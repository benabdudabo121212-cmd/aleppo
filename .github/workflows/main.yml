name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Extract Project Files
      run: |
        sudo apt-get install unzip
        unzip project-bolt-*.zip -d ./project-folder
        if [ -f "./project-folder/package.json" ]; then
          echo "ROOT_PATH=./project-folder" >> $GITHUB_ENV
        else
          SUB_DIR=$(find ./project-folder -name package.json -exec dirname {} \;)
          echo "ROOT_PATH=$SUB_DIR" >> $GITHUB_ENV
        fi

    - name: Install Android SDK & Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Dependencies and Build
      run: |
        cd ${{ env.ROOT_PATH }}
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
        npm run build
        npx cap init "Aleppo Delivery" "com.aleppo.delivery" --web-dir=dist || true
        npx cap add android || true
        npx cap sync
        
        # خطوة سحرية: زرع أمر حل تعارض الملفات المكررة (Duplicate Class Fix) داخل إعدادات أندرويد تلقائياً
        cd android
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        
        chmod +x gradlew
        ./gradlew assembleRelease
        cp app/build/outputs/apk/release/*-unsigned.apk ../../app-release.apk || cp app/build/outputs/apk/release/*.apk ../../app-release.apk

    - name: Upload APK Download Link
      uses: actions/upload-artifact@v4
      with:
        name: aleppo-delivery-apk
        path: app-release.apk
